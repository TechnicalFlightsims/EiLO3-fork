<script>
    function updateurl(base) {
        var newsrc = base + '' + new Date().getTime();
        return newsrc;
    }



async function drawimage(canvasId, imageUrl) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const response = await fetch(imageUrl, { cache: 'no-store' });
  const blob = await response.blob();

  const imageBitmap = await createImageBitmap(blob);
  ctx.drawImage(imageBitmap, 0, 0);
}

    window.addEventListener("contextmenu", e => e.preventDefault());

    function webreq(url) {
            fetch(url).then(function(response) {
                return response.text(); 
            }).then(function(data) {
                console.log(data);
            }).catch(function(err) {
                console.log('Fetch Error :-S', err);
            });
    }

    var canvas = document.getElementById("ircscreen");
    var height = canvas.height;
    var width = canvas.width;
    var ircheight = 600;
    var ircwidth = 800;
    var xlast = 1;
    var ylast = 1;
    var xdist = 0;
    var ydist = 0;
    var tick = 0;
    document.addEventListener('keydown',
                function (event) {
inputstring = "/keyboard?n?" + event.key;
            document.getElementById("key").innerHTML = inputstring;
    webreq(inputstring);
                }, false);    
    
    
    canvas.addEventListener('mousemove',
        function (event) {
            var rect = canvas.getBoundingClientRect();
            mousex = event.clientX - rect.left;
            mousey = event.clientY - rect.top;
            var ratioy = ircheight / height;
            var ratiox = ircwidth / width;
            var scaledx = mousex * ratiox;
            var scaledy = mousey * ratioy;
            var xmouse = scaledx
            var ymouse = scaledy;
            if (xlast == xmouse) {
                xdist = 0;
            }
            if (ylast == ymouse) {
                ydist = 0;
            }
            if (xlast < xmouse) {
                xdist = xmouse - xlast;
                xlast = xmouse;
            }
            if (xlast > xmouse) {
                xdist = xlast - xmouse;
                xlast = xmouse;
                xdist = xdist * -1
            }
            
            if (ylast < ymouse) {
                ydist = ymouse - ylast;
                ylast = ymouse;
            }
            if (ylast > ymouse) {
                ydist = ylast - ymouse;
                ylast = ymouse;
                ydist = ydist * -1
            }
            document.getElementById("xdist").innerHTML = xdist;
            document.getElementById("ydist").innerHTML = ydist;
            xlast = xmouse;
            ylast = ymouse;
            document.getElementById("xmouse").innerHTML = xmouse;
            document.getElementById("ymouse").innerHTML = ymouse;

            document.getElementById("xlast").innerHTML = xlast;
            document.getElementById("ylast").innerHTML = ylast;
            inputstring = "/mouse?" + xdist + "&" + ydist + "";
            webreq(inputstring);
            
    }, false);    
    
    canvas.addEventListener("click", function (evt) {
    var mousePos = getMousePos(canvas, evt);
    //click(mousePos.x,mousePos.y);
    alert('Left Click' + mousePos.x + ',' + mousePos.y);
    }, false);

    canvas.addEventListener('contextmenu', function(evt) {
        var mousePos = getMousePos(canvas, evt);
    //click(mousePos.x,mousePos.y);
    alert('Right Click: ' + mousePos.x + ',' + mousePos.y);
    }, false);

    
    function refreshscreen() {
       // var canvas = document.getElementById("ircscreen"); 
        
        var context = canvas.getContext("2d");
        var image = new Image();
        // prevent black rectangle
        image.src = updateurl("https://loremflickr.com/800/600/car");
        document.getElementById("src").innerHTML = image.src;
        canvas.width = canvas.width;
        image.onload = function() {
        
        context.drawImage(image, Math.random()*100, 0);
            
        };
    }
      
     
    
    // mouse
    function getMousePos(canvas, evt) {

        var rect = canvas.getBoundingClientRect();
        return {
            x: evt.clientX - rect.left,
            y: evt.clientY - rect.top
        };
    }
    
    const refreshrate = ms => new Promise(res => setTimeout(res, ms));

    const screenloop = async () => {
        await refreshrate(0); // 100 default
        drawimage("ircscreen","https://loremflickr.com/800/600/");
        //alert("Screen Refresh complete")
        screenloop()
    }
    //screenloop();
    function enable() {
        screenloop();
        
    }
</script>
